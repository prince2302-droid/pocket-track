<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Inner Soft Glow -->
  <circle cx="256" cy="256" r="160" fill="#ffffff" opacity="0.08" />

  <!-- Graduation Cap (Student) Icon Base -->
  <path d="M256 140 L400 215 L256 290 L112 215 Z" fill="#ffffff" />
  
  <!-- Cap Underbody -->
  <path d="M160 245 L160 320 C160 365 352 365 352 320 L352 245 L256 295 Z" fill="#e0e7ff" opacity="0.95" />
  
  <!-- Tassel / Currency Coin -->
  <circle cx="395" cy="285" r="32" fill="url(#coinGrad)" filter="url(#shadow)" />
  <text x="395" y="297" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">₹</text>

  <!-- Dual Wallet Indicators (UPI & Cash dots) -->
  <circle cx="216" cy="410" r="14" fill="#38bdf8" />
  <circle cx="256" cy="410" r="14" fill="#34d399" />
  <circle cx="296" cy="410" r="14" fill="#a855f7" />
</svg>
